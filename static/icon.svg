<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Background (Squircle for Android & iOS) -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer Pulse Ring (Audio & Emergency) -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="12"/>
  <circle cx="256" cy="230" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8"/>
  
  <!-- Microphone Body -->
  <g filter="url(#shadow)">
    <!-- Pill Shape -->
    <rect x="206" y="120" width="100" height="180" rx="50" fill="#FFFFFF"/>
    <!-- U-Stand -->
    <path d="M 166 230 C 166 300, 346 300, 346 230" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <!-- Vertical Stem -->
    <line x1="256" y1="300" x2="256" y2="370" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
    <!-- Base Bar -->
    <line x1="196" y1="370" x2="316" y2="370" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
  </g>
  
  <!-- Emergency Heartbeat / Wave at Bottom -->
  <path d="M 140 430 L 210 430 L 230 400 L 256 460 L 282 410 L 300 430 L 372 430" fill="none" stroke="#FDE047" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
